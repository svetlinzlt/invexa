# Конфигурация на Xcode проекта за XcodeGen.
#
#     brew install xcodegen && cd ios && xcodegen generate
#
# Файлът `.xcodeproj` е двоичен, огромен и се чупи при сливане. Тук стои
# описанието му като текст: правата, App Group-ите и членството на файловете
# по цели са записани веднъж и се възпроизвеждат еднакво всеки път.

name: Invexa

options:
  bundleIdPrefix: app.invexa
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # Swift 6 хваща състезанията за данни по време на компилация. При
    # приложение с виджет в отделен процес, App Intents и SwiftData това не е
    # формалност — трите пипат едно и също хранилище от различни нишки.
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # DEVELOPMENT_TEAM се задава чак когато има истинско устройство или
    # TestFlight. За симулатор не е нужен и празна стойност само пречи.

packages:
  InvexaCore:
    path: InvexaCore

targets:

  # ── Приложението ─────────────────────────────────────────────
  Invexa:
    type: application
    platform: iOS
    sources:
      - path: Invexa
    dependencies:
      - package: InvexaCore
        product: InvexaCore
      - target: InvexaWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.invexa
        CODE_SIGN_ENTITLEMENTS: Invexa/Invexa.entitlements
        # Иконата се поражда от `tools/make-icon.mjs`, не се рисува на ръка.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # Ключовете стоят тук, а не като INFOPLIST_KEY_* настройки: щом сочим
    # собствен Info.plist, Xcode спира да генерира и настройките се
    # пренебрегват мълчаливо. Тогава Face ID подканата изчезва без грешка.
    info:
      path: Invexa/Info.plist
      properties:
        CFBundleDisplayName: Invexa
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSFaceIDUsageDescription: "Заключва месеца ти, за да не се вижда от всеки, който вземе телефона."
        # Схемата, с която виджетът отваря записването.
        CFBundleURLTypes:
          - CFBundleURLName: app.invexa
            CFBundleURLSchemes: [invexa]
        # Ако някой файл липсва, шрифтът пада тихо към системния и екранът
        # изглежда почти правилно. Затова имената стоят изброени.
        UIAppFonts:
          - BodoniModa-Bold.ttf
          - BodoniModa-BoldItalic.ttf
          - HankenGrotesk-Regular.ttf
          - HankenGrotesk-Medium.ttf
          - HankenGrotesk-SemiBold.ttf
          - SplineSansMono-Regular.ttf
        ITSAppUsesNonExemptEncryption: false

  # ── Виджетите ────────────────────────────────────────────────
  InvexaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: InvexaWidgets
      # Виджетът е отделен процес и има нужда от същите типове. Изброяването
      # тук заменя ръчното отмятане на членство по цели — стъпката, която
      # най-лесно се забравя при добавяне на нов файл.
      - path: Invexa/Design
      - path: Invexa/Storage
    dependencies:
      - package: InvexaCore
        product: InvexaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.invexa.widgets
        CODE_SIGN_ENTITLEMENTS: InvexaWidgets/InvexaWidgets.entitlements
    info:
      path: InvexaWidgets/Info.plist
      properties:
        CFBundleDisplayName: Invexa
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # ── Часовникът ───────────────────────────────────────────────
  # Приложението е малко нарочно: часовникът отговаря на един въпрос при
  # вдигане на китката. Съществува и защото усложненията не могат да живеят
  # без приложение-домакин.
  #
  # Данните идват през iCloud, не през App Group: часовникът е отделно
  # устройство и не вижда папката на телефона.
  InvexaWatch:
    type: application
    platform: watchOS
    sources:
      - path: InvexaWatch
      - path: Invexa/Design
      - path: Invexa/Storage
    dependencies:
      - package: InvexaCore
        product: InvexaCore
      - target: InvexaWatchWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.invexa.watchkitapp
        CODE_SIGN_ENTITLEMENTS: InvexaWatch/InvexaWatch.entitlements
    info:
      path: InvexaWatch/Info.plist
      properties:
        CFBundleDisplayName: Invexa
        WKApplication: true
        # Свързва часовниковото приложение с телефонното.
        WKCompanionAppBundleIdentifier: app.invexa

  InvexaWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: InvexaWatchWidgets
      # Самият виджет е споделен с телефона; тук се внася същият код.
      - path: InvexaWidgets/MonthWidget.swift
      - path: Invexa/Design
      - path: Invexa/Storage
    dependencies:
      - package: InvexaCore
        product: InvexaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.invexa.watchkitapp.widgets
        CODE_SIGN_ENTITLEMENTS: InvexaWatch/InvexaWatch.entitlements
    info:
      path: InvexaWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Invexa
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  Invexa:
    build:
      targets:
        Invexa: all
    run:
      config: Debug

  InvexaWatch:
    build:
      targets:
        InvexaWatch: all
    run:
      config: Debug
    # Тестовете на пакета се пускат с `swift test`, в отделна задача на
    # работния поток. Схемата не може да ги сочи: XcodeGen чете
    # `InvexaCore/InvexaCoreTests` като външен проект и спира с грешка.
