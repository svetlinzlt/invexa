<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0F1F">
<title>Invexa — прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500&display=swap">
<style>
:root{
  --ink:#0A0F1F; --ink2:#101731;
  --violet:#8F7BFF; --violet-lift:#B8ACFF;
  --mint:#4FE3C1; --brass:#E0C77E;
  --pale:#DEE5FA; --pale2:#9AA6CC; --pale3:#64709A;
  --panel:rgba(150,170,225,.075); --edge:rgba(190,206,255,.20);
  --hair:rgba(150,170,225,.16); --hair2:rgba(150,170,225,.09);
  --glow1:rgba(91,73,196,.36); --glow2:rgba(42,158,133,.20);
  --wave-fill:rgba(143,123,255,.22);
  --cell:rgba(16,23,49,.62);
  --chip-bg:rgba(150,170,225,.08);
  --chip-on:rgba(143,123,255,.2); --chip-on-br:rgba(143,123,255,.5);
  --good-bg:rgba(79,227,193,.09); --good-br:rgba(79,227,193,.26);
  --warn-bg:rgba(143,123,255,.09); --warn-br:rgba(143,123,255,.26);
  --key:rgba(150,170,225,.07); --key-hit:rgba(150,170,225,.16);
  --onaccent:#0B0820;
  --top:env(safe-area-inset-top,0px);
  --bot:env(safe-area-inset-bottom,0px);
}
/* Светлата тема е същата, обърната: хартията е студено синьо-сива, не
   кремава, а виолетовото потъмнява с една степен, за да остане четимо. */
html[data-theme="light"]{
  --ink:#DDE2EF; --ink2:#EAEDF6;
  --violet:#4A38B8; --violet-lift:#6E5CD8;
  --mint:#0F7C66; --brass:#8A6D1A;
  --pale:#111A33; --pale2:#414D75; --pale3:#5B678F;
  --panel:rgba(255,255,255,.55); --edge:rgba(255,255,255,.85);
  --hair:rgba(40,50,90,.16); --hair2:rgba(40,50,90,.09);
  --glow1:rgba(122,104,232,.26); --glow2:rgba(42,158,133,.16);
  --wave-fill:rgba(74,56,184,.17);
  --cell:rgba(255,255,255,.5);
  --chip-bg:rgba(40,50,90,.06);
  --chip-on:rgba(74,56,184,.14); --chip-on-br:rgba(74,56,184,.45);
  --good-bg:rgba(15,124,102,.10); --good-br:rgba(15,124,102,.3);
  --warn-bg:rgba(74,56,184,.09); --warn-br:rgba(74,56,184,.28);
  --key:rgba(40,50,90,.05); --key-hit:rgba(40,50,90,.12);
  --onaccent:#FFFFFF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{
  background:var(--ink); color:var(--pale);
  font-family:"Hanken Grotesk",-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column;
}
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(118% 60% at 50% -14%, var(--glow1) 0%, transparent 62%),
    radial-gradient(92% 50% at 50% 110%, var(--glow2) 0%, transparent 64%);
}
/* Превключвателят стои над съдържанието, а не в таб лентата: тя е за
   навигация, а темата не е място, където се ходи. */
#theme{
  position:fixed; z-index:5; top:calc(var(--top) + 10px); right:14px;
  width:34px; height:34px; border-radius:12px; display:grid; place-items:center;
  font-size:15px; cursor:pointer; color:var(--pale2);
  background:var(--panel); border:1px solid var(--hair);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
}
#app{position:relative;z-index:1;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(var(--top) + 14px) 16px 16px}
.num{font-family:"Bodoni Moda",Georgia,serif;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.mono{font-family:"Spline Sans Mono",monospace;font-variant-numeric:tabular-nums}
.cap{font-family:"Spline Sans Mono",monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--pale3)}
.gl{background:var(--panel);border:1px solid var(--edge);border-radius:20px;
  backdrop-filter:blur(26px) saturate(165%);-webkit-backdrop-filter:blur(26px) saturate(165%);
  box-shadow:inset 0 1px 0 rgba(215,228,255,.32)}
h2{font-size:17px;font-weight:700;letter-spacing:-.02em;margin:4px 0 0}

/* месец */
.head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:2px}
.big{font-size:44px;line-height:1;margin-top:6px}
.big sup{font-size:.42em;font-weight:500;color:var(--pale2);vertical-align:.74em;margin-left:.08em}
.sub{font-size:11px;color:var(--pale2);margin-top:3px}
svg.wave{display:block;width:100%;height:92px;margin-top:10px}
.axis{display:flex;justify-content:space-between;padding:6px 2px 0}
.flows{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--hair2);
  border-radius:13px;overflow:hidden;margin-top:14px}
.flow{padding:12px 10px;background:var(--cell);display:flex;flex-direction:column;gap:5px}
/* Цветовете на кривата идват от променливи, за да следват темата без
   пречертаване. */
.wave .fill{fill:var(--wave-fill)}
.wave .line{stroke:var(--violet)}
.wave .mark{stroke:var(--mint)}
.wave .dot{fill:var(--mint)}
.flow b{font-family:"Bodoni Moda",Georgia,serif;font-weight:700;font-size:17px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.rows{padding:16px;display:flex;flex-direction:column;gap:12px;margin-top:14px}
.row{display:flex;flex-direction:column;gap:6px}
.rowl{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px}
.rowl b{font-weight:500}
.rowl span{font-size:10.5px;color:var(--pale2)}
.bar{height:3px;border-radius:2px;background:rgba(150,170,225,.13);overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;background:var(--violet)}

/* списъци */
.day{display:flex;justify-content:space-between;padding:14px 5px 7px}
.item{display:flex;align-items:center;gap:11px;padding:10px 13px;border-bottom:1px solid var(--hair2)}
.item:last-child{border-bottom:none}
.dot{width:29px;height:29px;border-radius:10px;flex:0 0 auto;display:grid;place-items:center;
  font-size:13px;background:rgba(150,170,225,.10);border:1px solid var(--hair)}
.imeta{flex:1;min-width:0}
.imeta b{display:block;font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imeta span{display:block;font-size:9.5px;color:var(--pale3);margin-top:1px}
.amt{font-family:"Spline Sans Mono",monospace;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.plus{color:var(--mint)}
.empty{text-align:center;color:var(--pale2);font-size:13px;padding:60px 20px}

/* сравнение */
.bars{display:flex;align-items:flex-end;gap:9px;height:130px;margin-top:6px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;height:100%}
.col .v{font-family:"Spline Sans Mono",monospace;font-size:9.5px;text-align:center;color:var(--pale2)}
.col .b{border:1px solid var(--hair);border-radius:5px 5px 2px 2px;background:rgba(150,170,225,.16)}
.col.now .b{background:linear-gradient(180deg,#B8ACFF,rgba(143,123,255,.3));border-color:rgba(143,123,255,.55)}
.col .l{font-family:"Spline Sans Mono",monospace;font-size:8.5px;text-align:center;letter-spacing:.09em;text-transform:uppercase;color:var(--pale3)}
.verdict{display:flex;gap:11px;align-items:center;padding:12px 14px;border-radius:13px;margin-top:15px}

/* таб лента */
#tabs{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-around;
  margin:0 16px calc(var(--bot) + 8px);padding:10px 8px;border-radius:24px}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:8.5px;color:var(--pale3);
  flex:1;cursor:pointer;user-select:none}
.tab i{font-style:normal;font-size:15px;opacity:.55}
.tab.on{color:var(--violet)} .tab.on i{opacity:1}
#addBtn{width:39px;height:39px;border-radius:15px;display:grid;place-items:center;font-size:22px;
  color:var(--onaccent);background:linear-gradient(180deg,var(--violet-lift),var(--violet));
  box-shadow:0 8px 20px -6px rgba(143,123,255,.8);cursor:pointer;flex:0 0 auto}

/* лист */
#sheet{position:fixed;inset:0;z-index:10;display:none;align-items:flex-end;
  background:rgba(5,8,18,.5);backdrop-filter:blur(3px)}
#sheet.open{display:flex}
.card{width:100%;margin:8px;padding:16px 16px calc(var(--bot) + 16px);border-radius:30px;
  display:flex;flex-direction:column;gap:12px;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.grab{width:36px;height:4px;border-radius:2px;background:rgba(200,215,255,.3);margin:0 auto}
.seg{display:flex;gap:5px;padding:3px;background:rgba(150,170,225,.08);border-radius:999px}
.seg div{flex:1;text-align:center;padding:7px 0;font-size:11.5px;border-radius:999px;cursor:pointer;color:var(--pale2)}
.seg div.on{color:#0B0820;font-weight:600}
.entry{text-align:center;font-family:"Bodoni Moda",Georgia,serif;font-weight:700;font-size:46px;letter-spacing:-.03em;padding:4px 0}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;font-size:10.5px;padding:6px 11px;border-radius:999px;
  background:var(--chip-bg);border:1px solid var(--hair);color:var(--pale2);cursor:pointer}
.chip.on{background:var(--chip-on);border-color:var(--chip-on-br);color:var(--violet)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pad b{font-family:"Bodoni Moda",Georgia,serif;font-weight:500;font-size:20px;text-align:center;padding:11px 0;
  border-radius:12px;background:var(--key);border:1px solid var(--hair2);cursor:pointer;user-select:none}
.pad b:active{background:var(--key-hit)}
.go{text-align:center;padding:14px;border-radius:16px;font-size:14px;font-weight:600;color:var(--onaccent);cursor:pointer}
.go.off{opacity:.45}
.note{font-size:10.5px;color:var(--pale3);text-align:center}
.banner{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--violet);color:#0B0820;
  font-size:12px;text-align:center;padding:9px 14px calc(var(--bot) + 9px);display:none}
</style>
</head>
<body>

<div id="theme" title="Смени темата">☾</div>
<div id="app"></div>

<nav id="tabs" class="gl">
  <div class="tab on" data-tab="month"><i>▤</i>Месец</div>
  <div class="tab" data-tab="ledger"><i>≡</i>Дневник</div>
  <div id="addBtn">+</div>
  <div class="tab" data-tab="recurring"><i>↻</i>Повтарящи</div>
  <div class="tab" data-tab="compare"><i>▥</i>Сравнение</div>
</nav>

<div id="sheet"><div class="card gl">
  <div class="grab"></div>
  <div class="seg" id="kind">
    <div class="on" data-k="expense">Разход</div>
    <div data-k="income">Приход</div>
    <div data-k="movement">Заделяне</div>
  </div>
  <div class="cap" id="sheetTitle" style="text-align:center">Нов разход</div>
  <div class="entry" id="entry">0,00 €</div>
  <div class="chips" id="chips"></div>
  <div class="pad">
    <b>1</b><b>2</b><b>3</b><b>4</b><b>5</b><b>6</b><b>7</b><b>8</b><b>9</b><b>,</b><b>0</b><b>⌫</b>
  </div>
  <div class="go off" id="save">Запиши</div>
  <div class="note" id="closeHint">Докосни извън листа, за да откажеш</div>
</div></div>

<div class="banner" id="banner"></div>

<script>
(function(){
"use strict";

/* ── Пари в стотинки, както в самото приложение. Никакви дробни числа. ── */
const fmt = c => (c/100).toLocaleString('bg-BG',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €';
const CATS = [
  ['groceries','Хранителни стоки'],['housing','Жилище'],['eating_out','Заведения'],
  ['transport','Транспорт'],['utilities','Сметки'],['shopping','Пазаруване'],
  ['health','Здраве'],['entertainment','Развлечения'],['travel','Пътувания'],['other','Друго']
];
const MOVES = [['savings','Спестявания'],['investment','Инвестиции'],['debt','Погасяване']];
const catName = id => (CATS.find(c=>c[0]===id)||['','Друго'])[1];

const NOW = new Date();
const Y = NOW.getFullYear(), M = NOW.getMonth();
const daysInMonth = (y,m) => new Date(y,m+1,0).getDate();
const DIM = daysInMonth(Y,M), TODAY = NOW.getDate();

/* ── Състояние ─────────────────────────────────────────────── */
const KEY = 'invexa.prototype.v1';
const TKEY = 'invexa.prototype.theme';
let state = load();

/* ── Тема ──────────────────────────────────────────────────── */
/* При първо отваряне следва настройката на телефона. След това помни
   избора, защото изричното решение на човека бие системното. */
function readTheme(){
  try{ const t=localStorage.getItem(TKEY); if(t) return t; }catch(e){}
  return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
}
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('theme').textContent = t==='light' ? '☾' : '☀';
  /* Лентата на състоянието в Safari следва фона, иначе стърчи. */
  const m=document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute('content', t==='light' ? '#DDE2EF' : '#0A0F1F');
}
let theme = readTheme();
applyTheme(theme);
document.getElementById('theme').addEventListener('click',()=>{
  theme = theme==='light' ? 'dark' : 'light';
  applyTheme(theme);
  try{ localStorage.setItem(TKEY, theme); }catch(e){}
});

function seed(){
  const f = [];
  const add = (d,c,m,cat,kind='expense',mv=null)=>f.push({id:Math.random().toString(36).slice(2),day:d,cents:c,merchant:m,cat,kind,mv});
  add(1,28000,'Наем','housing');
  add(2,3420,'Лидл','groceries'); add(3,680,'Bolt','transport');
  add(4,1899,'Виваком','utilities'); add(5,5130,'Фантастико','groceries');
  add(6,450,'Кафе','eating_out'); add(8,2280,'Билла','groceries');
  add(9,1650,'Ресторант','eating_out'); add(11,890,'Аптека','health');
  add(12,1200,'Bolt','transport'); add(14,6300,'Пазаруване','shopping');
  add(16,1099,'Spotify','entertainment'); add(18,117000,'Заплата',null,'income');
  add(18,50000,'Спестовна',null,'movement','savings');
  if(TODAY>=19) add(19,4200,'Кауфланд','groceries');
  if(TODAY>=21) add(21,3420,'Лидл','groceries');
  return {flows:f.filter(x=>x.day<=TODAY), rules:[
    {d:24,name:'Netflix',cents:1299,cat:'entertainment'},
    {d:26,name:'iCloud+',cents:299,cat:'entertainment'},
    {d:28,name:'Топлофикация',cents:3140,cat:'utilities'},
    {d:1,name:'Наем',cents:28000,cat:'housing'}
  ]};
}
function load(){
  try{ const raw=localStorage.getItem(KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return seed();
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} }

/* ── Сметките — същите правила като в приложението ──────────── */
function summary(){
  let income=0,spent=0,saved=0,invested=0,debt=0;
  const daily=new Array(DIM).fill(0), byCat={};
  for(const f of state.flows){
    if(f.kind==='income'){ income+=f.cents; continue; }
    if(f.kind==='movement'){
      if(f.mv==='savings') saved+=f.cents;
      else if(f.mv==='investment') invested+=f.cents;
      else debt+=f.cents;
      continue;                      /* движението НЕ е разход */
    }
    spent+=f.cents; daily[f.day-1]+=f.cents;
    byCat[f.cat||'other']=(byCat[f.cat||'other']||0)+f.cents;
  }
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  return {income,spent,saved,invested,debt,daily,cats,remaining:income-spent-saved-invested-debt};
}

/* ── Кривата ───────────────────────────────────────────────── */
function wave(daily){
  const W=320,H=92,pad=11,peak=Math.max(...daily,1);
  const pts=daily.map((v,i)=>({x:i/(daily.length-1)*W, y:H-pad-(v/peak)*(H-pad*2)}));
  let d=`M${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    d+=` C${(p1.x+(p2.x-p0.x)/6).toFixed(1)},${(p1.y+(p2.y-p0.y)/6).toFixed(1)} ${(p2.x-(p3.x-p1.x)/6).toFixed(1)},${(p2.y-(p3.y-p1.y)/6).toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
  }
  const tx=((TODAY-1)/(daily.length-1)*W).toFixed(1);
  return `<svg class="wave" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <path class="fill" d="${d} L${W},${H} L0,${H} Z"/>
    <path class="line" d="${d}" fill="none" stroke-width="2" stroke-linecap="round"/>
    <line class="mark" x1="${tx}" y1="0" x2="${tx}" y2="${H}" stroke-width=".9" stroke-opacity=".5" stroke-dasharray="2 3"/>
    <circle class="dot" cx="${tx}" cy="${pts[TODAY-1].y.toFixed(1)}" r="3.4"/></svg>`;
}

/* ── Екрани ────────────────────────────────────────────────── */
const MONTHS=['януари','февруари','март','април','май','юни','юли','август','септември','октомври','ноември','декември'];
let tab='month';

function screenMonth(){
  const s=summary(), top=s.cats[0]?s.cats[0][1]:1;
  return `<div class="head"><div>
      <div class="cap">${MONTHS[M]} ${Y}</div>
      <div class="num big">${fmt(s.spent).replace(' €','')}<sup>€</sup></div>
      <div class="sub">похарчено за ${TODAY} от ${DIM} дни</div>
    </div></div>
    ${wave(s.daily)}
    <div class="axis"><span class="cap">1</span><span class="cap">днес</span><span class="cap">${DIM}</span></div>
    <div class="flows">
      <div class="flow"><span class="cap">Влезли</span><b style="color:var(--mint)">${fmt(s.income)}</b></div>
      <div class="flow"><span class="cap">Заделени</span><b style="color:var(--brass)">${fmt(s.saved+s.invested)}</b></div>
      <div class="flow"><span class="cap">Остават</span><b>${fmt(s.remaining)}</b></div>
    </div>
    <div class="gl rows">
      <span class="cap">Къде отидоха</span>
      ${s.cats.length?s.cats.slice(0,6).map(([id,c])=>`<div class="row">
        <div class="rowl"><b>${catName(id)}</b><span class="mono">${fmt(c)}</span></div>
        <div class="bar"><i style="width:${(c/top*100).toFixed(0)}%"></i></div></div>`).join('')
        :'<div class="sub">Още няма разходи. Докосни ➕ и запиши първия.</div>'}
    </div>`;
}

function screenLedger(){
  if(!state.flows.length) return `<h2>Дневник</h2><div class="empty">Няма записи.<br>Докосни ➕ отдолу.</div>`;
  const byDay={};
  state.flows.forEach(f=>{(byDay[f.day]=byDay[f.day]||[]).push(f)});
  const days=Object.keys(byDay).map(Number).sort((a,b)=>b-a);
  return `<h2>Дневник</h2>` + days.map(d=>{
    const list=byDay[d];
    const net=list.reduce((n,f)=>n+(f.kind==='income'?f.cents:f.kind==='expense'?-f.cents:0),0);
    return `<div class="day"><span class="cap">${d} ${MONTHS[M]}</span>
      <span class="cap" style="color:${net>0?'var(--mint)':'var(--pale3)'}">${net>0?'+':''}${fmt(Math.abs(net))}</span></div>
      <div class="gl" style="overflow:hidden">${list.map(f=>`
        <div class="item" data-del="${f.id}">
          <span class="dot">${f.kind==='income'?'↓':f.kind==='movement'?'⇄':'▦'}</span>
          <span class="imeta"><b>${f.merchant}</b><span>${
            f.kind==='income'?'Приход':f.kind==='movement'?(MOVES.find(m=>m[0]===f.mv)||['','Превод'])[1]:catName(f.cat)
          } · докосни за изтриване</span></span>
          <span class="amt ${f.kind==='income'?'plus':''}">${f.kind==='income'?'+':f.kind==='expense'?'−':''}${fmt(f.cents)}</span>
        </div>`).join('')}</div>`;
  }).join('');
}

function screenRecurring(){
  const monthly=state.rules.reduce((n,r)=>n+r.cents,0);
  const upcoming=state.rules.filter(r=>r.d>TODAY).reduce((n,r)=>n+r.cents,0);
  return `<h2>Повтарящи се</h2>
    <div class="gl" style="padding:16px;display:flex;justify-content:space-between;margin-top:12px">
      <div><span class="cap">Месечно</span><div class="num" style="font-size:26px;margin-top:6px">${fmt(monthly)}</div></div>
      <div style="text-align:right"><span class="cap">Предстоят</span>
        <div class="num" style="font-size:26px;margin-top:6px;color:var(--violet)">${fmt(upcoming)}</div></div>
    </div>
    <div class="gl" style="overflow:hidden;margin-top:12px">
      ${state.rules.slice().sort((a,b)=>(a.d>TODAY?0:1)-(b.d>TODAY?0:1)||a.d-b.d).map(r=>{
        const soon=r.d>TODAY&&r.d-TODAY<=7, past=r.d<=TODAY;
        return `<div class="item" style="opacity:${past?.45:1}">
          <span class="dot mono" style="color:${soon?'var(--violet)':'inherit'}">${r.d}</span>
          <span class="imeta"><b>${r.name}</b><span>${past?'платен':soon?'след '+(r.d-TODAY)+' дни':'следващ месец'} · ${catName(r.cat)}</span></span>
          <span class="amt">${fmt(r.cents)}</span></div>`;
      }).join('')}
    </div>`;
}

function screenCompare(){
  const s=summary();
  const hist=[134000,151200,126800,140200,126800,s.spent];
  const labels=['мар','апр','май','юни','юли',MONTHS[M].slice(0,3)];
  const peak=Math.max(...hist,1);
  const delta=s.spent-126800;
  const good=delta<=0, tint=good?'var(--mint)':'var(--violet)';
  return `<h2>Месец до месец</h2>
    <div class="gl" style="padding:16px;margin-top:12px">
      <div class="bars">${hist.map((v,i)=>`<div class="col${i===5?' now':''}">
        <span class="v">${Math.round(v/100)}</span>
        <span class="b" style="height:${(v/peak*100).toFixed(0)}%"></span>
        <span class="l">${labels[i]}</span></div>`).join('')}</div>
      <div class="verdict" style="background:var(${good?'--good-bg':'--warn-bg'});border:1px solid var(${good?'--good-br':'--warn-br'})">
        <b class="num" style="font-size:19px;color:${tint}">${delta>0?'+':'−'}${fmt(Math.abs(delta))}</b>
        <span style="font-size:10.5px;color:var(--pale2)">${good?'под':'над'} юли на същия ден от месеца. Средно за завършените: 1&nbsp;358,00&nbsp;€.</span>
      </div>
    </div>
    <div class="note" style="margin-top:18px;text-align:left;line-height:1.5">
      Предходните месеци са примерни данни. Само текущият се променя от това,
      което записваш.
    </div>`;
}

function render(){
  const app=document.getElementById('app');
  app.innerHTML = tab==='month'?screenMonth():tab==='ledger'?screenLedger():
                  tab==='recurring'?screenRecurring():screenCompare();
  app.scrollTop=0;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===tab));
  app.querySelectorAll('[data-del]').forEach(el=>el.addEventListener('click',()=>{
    state.flows=state.flows.filter(f=>f.id!==el.dataset.del); save(); render(); toast('Записът е изтрит');
  }));
}

/* ── Листът за записване ───────────────────────────────────── */
let kind='expense', pick=CATS[0][0], mv='savings', digits='';
const sheet=document.getElementById('sheet');

function chips(){
  const list = kind==='movement'?MOVES : kind==='income'?[] : CATS;
  const sel = kind==='movement'?mv:pick;
  document.getElementById('chips').innerHTML = list.length
    ? list.map(([id,n])=>`<span class="chip${id===sel?' on':''}" data-c="${id}">${n}</span>`).join('')
    : '<span class="note" style="padding:6px 2px">Приходите не се категоризират.</span>';
  document.querySelectorAll('#chips .chip').forEach(c=>c.addEventListener('click',()=>{
    if(kind==='movement') mv=c.dataset.c; else pick=c.dataset.c; chips();
  }));
}
function tint(){ return kind==='expense'?'var(--violet)':kind==='income'?'var(--mint)':'var(--brass)'; }
function refreshSheet(){
  const cents=parseInt(digits||'0',10);
  document.getElementById('entry').textContent=fmt(cents);
  document.getElementById('sheetTitle').textContent =
    kind==='expense'?'Нов разход':kind==='income'?'Нов приход':'Заделяне';
  const go=document.getElementById('save');
  go.classList.toggle('off',cents<=0);
  go.style.background=`linear-gradient(180deg,${tint()},${tint()})`;
  document.querySelectorAll('#kind div').forEach(d=>{
    const on=d.dataset.k===kind; d.classList.toggle('on',on);
    d.style.background=on?tint():'transparent';
  });
  chips();
}
/* Видът се връща на „разход" при всяко отваряне. Той е най-честият случай
   и не бива да зависи от това какво си избрал предния път — иначе следващият
   разход тихо влиза при приходите. */
function openSheet(){ digits=''; kind='expense'; pick=CATS[0][0]; sheet.classList.add('open'); refreshSheet(); }
function closeSheet(){ sheet.classList.remove('open'); }

document.getElementById('addBtn').addEventListener('click',openSheet);
sheet.addEventListener('click',e=>{ if(e.target===sheet) closeSheet(); });
document.querySelectorAll('#kind div').forEach(d=>d.addEventListener('click',()=>{kind=d.dataset.k;refreshSheet();}));
document.querySelectorAll('.pad b').forEach(b=>b.addEventListener('click',()=>{
  const t=b.textContent;
  if(t==='⌫') digits=digits.slice(0,-1);
  else if(t===',') return;
  else if(digits.length<7) digits+=t;
  refreshSheet();
}));
document.getElementById('save').addEventListener('click',()=>{
  const cents=parseInt(digits||'0',10);
  if(cents<=0) return;
  state.flows.push({
    id:Math.random().toString(36).slice(2), day:TODAY, cents,
    merchant: kind==='income'?'Приход':kind==='movement'?(MOVES.find(m=>m[0]===mv)||['','Заделено'])[1]:catName(pick),
    cat: kind==='expense'?pick:null, kind, mv: kind==='movement'?mv:null
  });
  save(); closeSheet(); tab='month'; render();
  toast(kind==='expense'?'Записано':'Готово');
});

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{tab=t.dataset.tab;render();}));

/* ── Дребно ────────────────────────────────────────────────── */
let toastTimer;
function toast(msg){
  const b=document.getElementById('banner');
  b.textContent=msg; b.style.display='block';
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>b.style.display='none',1600);
}
// Тройно докосване на заглавието връща примерните данни.
let taps=0,tapTimer;
document.addEventListener('click',e=>{
  if(!e.target.closest('.cap')) return;
  taps++; clearTimeout(tapTimer); tapTimer=setTimeout(()=>taps=0,600);
  if(taps>=3){ taps=0; state=seed(); save(); render(); toast('Данните са върнати в начално състояние'); }
});

render();
})();
</script>
</body>
</html>
